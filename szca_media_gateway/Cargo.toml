[package]
name = "szca_media_gateway"
version = "5.0.0"
edition = "2021"
description = "SZCA Real-Time Voice Engine — Media Gateway"
authors = ["SZCA Team"]
license = "Apache-2.0"

[[bin]]
name = "szca_media_gateway"
path = "src/main.rs"

[lib]
name = "szca_media_gateway"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["ws", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util", "signal"] }
futures = "0.3"
futures-util = "0.3"
uuid = { version = "1.6", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray"] }
ndarray = "0.16"
hdrhistogram = "7.5"
num_cpus = "1.16"
deep_filter = { version = "0.2.5", features = ["transforms"] }
# Streaming STT log-mel frontend. Already in the lock file as a `deep_filter`
# dependency, so making it direct pulls in no new crates and no new versions.
realfft = "3.5"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
misaki-rs = { version = "0.3.0", default-features = false }
crossbeam-channel = "0.5"
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["timeout"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"
# Collects an axum response body in tests so SSE handlers can be asserted on the
# actual wire bytes (Event has no getters).
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
