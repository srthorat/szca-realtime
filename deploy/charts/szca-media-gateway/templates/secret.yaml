{{- if .Values.envSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "szca-media-gateway.fullname" . }}-secrets
  labels:
    {{- include "szca-media-gateway.labels" . | nindent 4 }}
type: Opaque
data: {}
# Values populated by External Secrets Operator (see externalsecret.yaml).
# For static secrets, add fields here:
#   SZCA_API_KEY: <base64>
#   LLM_API_KEY: <base64>
{{- end }}
