user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Map for WebSocket Upgrade header handling
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstream vLLM worker pool (sticky session + keepalive)
    upstream vllm_workers {
        hash $cookie_vllm_worker consistent;
        least_conn;
        server worker1:8000 max_fails=3 fail_timeout=30s;
        server worker2:8000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # Upstream Media Gateway pool
    upstream gateway_backend {
        server gateway:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            proxy_pass http://gateway_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Metrics endpoint
        location /metrics {
            proxy_pass http://gateway_backend/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Real-time WebSocket streaming route
        location /v1/realtime {
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # vLLM direct API route (if externalized)
        location /v1/chat/completions {
            proxy_pass http://vllm_workers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # Default fallback to gateway HTTP routes (/v1/stt, /v1/llm, /v1/tts)
        location / {
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
